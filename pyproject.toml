[project]
name = "home-assistant-luxembourg-fuel-monitor"
version = "0.1.0"
description = "Luxembourg official maximum fuel prices, trends and refuelling insights for Home Assistant."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["custom_components"]

[tool.ruff.lint]
select = [
    "A", "ASYNC", "B", "C4", "E", "F", "I", "N", "PERF", "PL", "PTH",
    "RET", "RUF", "SIM", "UP", "W",
]
ignore = [
    "PLR0912",  # too many branches
    "PLR0913",  # too many arguments
    "PLR2004",  # magic value comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101", "SLF001"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.lux_fuel_monitor"]

[tool.mypy]
python_version = "3.12"
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

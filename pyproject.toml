[project]
name = "home-assistant-luxembourg-fuel-monitor"
version = "0.1.0"
description = "Luxembourg official maximum fuel prices, trends and refuelling insights for Home Assistant."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["custom_components"]

[tool.ruff.lint]
# Pragmatic set: real-bug rules (pyflakes, bugbear, async), modernisation and
# import hygiene. Line length is left to the formatter, not the linter.
select = ["F", "E4", "E7", "E9", "W", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SLF001", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.lux_fuel_monitor"]

[tool.mypy]
# Advisory only (run locally); not a CI gate.
python_version = "3.12"
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

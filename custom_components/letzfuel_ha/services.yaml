calculate_fill_cost:
  fields:
    liters:
      required: true
      example: 45
      selector:
        number:
          min: 0.1
          max: 500
          step: 0.1
          unit_of_measurement: L
          mode: box
    fuel_type:
      required: false
      example: diesel
      selector:
        select:
          translation_key: fuel_type
          options:
            - diesel
            - sp95
            - sp98
    use_tomorrow_price:
      required: false
      default: false
      selector:
        boolean:

calculate_trip_cost:
  fields:
    distance_km:
      required: true
      example: 320
      selector:
        number:
          min: 0.1
          max: 100000
          step: 0.1
          unit_of_measurement: km
          mode: box
    consumption_l_100km:
      required: true
      example: 6.5
      selector:
        number:
          min: 0.1
          max: 100
          step: 0.1
          unit_of_measurement: L/100 km
          mode: box
    fuel_type:
      required: false
      example: diesel
      selector:
        select:
          translation_key: fuel_type
          options:
            - diesel
            - sp95
            - sp98
